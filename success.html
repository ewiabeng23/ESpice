<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order received</title>
<meta name="theme-color" content="#0F4D33">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{--board:#0F4D33;--gold:#F2C14E;--pepper:#C62D1F;--paper:#F3F5EF;--surface:#fff;--ink:#18261E;--muted:#56655B;--line:#D5DDD2;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1812;--surface:#15221A;--ink:#E7EEE4;--muted:#9DAEA2;--line:#253629}}
:root[data-theme="dark"]{--paper:#0E1812;--surface:#15221A;--ink:#E7EEE4;--muted:#9DAEA2;--line:#253629}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
.top{background:var(--board);border-bottom:3px solid var(--gold);padding:14px 20px}
.top a{font-family:"Bungee","Arial Black",sans-serif;color:var(--gold);text-decoration:none}
main{max-width:560px;margin:0 auto;padding:48px 20px 64px}
h1{font-family:"Bungee","Arial Black",sans-serif;font-weight:400;color:var(--board);font-size:clamp(34px,8vw,48px);line-height:1;margin:0 0 14px;text-shadow:3px 3px 0 var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:var(--gold);text-shadow:3px 3px 0 var(--pepper)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:26px 0}
.card ul{list-style:none;margin:0;padding:0}
.card li{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--line)}
.card li:last-child{border-bottom:0;font-weight:800}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 16px/1 inherit;padding:15px 24px;border-radius:999px;text-decoration:none;margin:6px 8px 0 0}
.btn-board{background:var(--board);color:#fff}
.btn-line{border:2px solid var(--line);color:var(--ink)}
:focus-visible{outline:3px solid var(--pepper);outline-offset:3px}
</style>
</head>
<body>
<header class="top"><a href="/" data-fill="name">ESpice</a></header>
<main>
  <h1>Order received</h1>
  <p id="lead">Your payment went through and your order is with the grill team.</p>
  <div class="card" id="summary" hidden></div>
  <p class="muted">Your receipt is on its way to your email. If anything changes, we'll message you on the number you gave us.</p>
  <a class="btn btn-board" href="/">Back to the menu</a>
  <a class="btn btn-line" id="waLink" target="_blank" rel="noopener">Message us on WhatsApp</a>
</main>
<script src="shop.js"></script>
<script>
(function(){
  var S = Shop.SHOP;
  document.querySelectorAll("[data-fill='name']").forEach(function(el){ el.textContent = S.name; });
  document.getElementById("waLink").href = "https://wa.me/" + S.whatsapp + "?text=" + encodeURIComponent("Hi " + S.name + ", I have a question about my order.");
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  var last = null;
  try { last = JSON.parse(localStorage.getItem("suya-last-order") || "null"); localStorage.removeItem("suya-basket-v1"); } catch(e){}
  if (!last) return;
  document.getElementById("lead").textContent = last.fulfilment === "delivery"
    ? "Payment received. We'll deliver your order around " + last.when + "."
    : "Payment received. Your order will be ready to collect at " + last.when + " from " + S.address + ".";
  var rows = last.lines.map(function(l){ return "<li><span>" + l.qty + " \u00d7 " + esc(l.name) + (l.spiceLabel ? " (" + esc(l.spiceLabel) + ")" : "") + "</span><span>" + Shop.formatPrice(l.total) + "</span></li>"; });
  if (last.deliveryFee) rows.push("<li><span>Delivery</span><span>" + Shop.formatPrice(last.deliveryFee) + "</span></li>");
  rows.push("<li><span>Total paid</span><span>" + Shop.formatPrice(last.total) + "</span></li>");
  var box = document.getElementById("summary"); box.innerHTML = "<ul>" + rows.join("") + "</ul>"; box.hidden = false;
  try { localStorage.removeItem("suya-last-order"); } catch(e){}
})();
</script>
</body>
</html>
